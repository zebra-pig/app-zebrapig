[project]
name = "docs"
authors = [
    { name = "Zebra & Pig", email = "info@zebrapig.com" },
]
description = "Zebra & Pig business documents — the print formats for invoices, quotations, orders, payments and certificates."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "docs"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
