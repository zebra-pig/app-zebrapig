[project]
name = "gear"
authors = [
    { name = "Zebra & Pig", email = "info@zebrapig.com" },
]
description = "Gear management — equipment tracking with NFC/Crockford tokens for Zebra & Pig."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "gear"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
