[project]
name = "swisstax"
authors = [
    { name = "Zebra & Pig", email = "info@zebrapig.com" },
]
description = "Swiss statutory paperwork for ERPNext — Lohnausweis (Formular 11) and the simplified annual statement for self-employed persons (Art. 957 Abs. 2 OR)."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "swisstax"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
